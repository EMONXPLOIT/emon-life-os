<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emon Smart Manager</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    * {
      font-family: 'Hind Siliguri', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0b1021] text-slate-100 min-h-screen flex flex-col">

  <!-- Top App Bar -->
  <header class="bg-[#121936] border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="layers" class="text-indigo-400 w-6 h-6"></i>
        <h1 class="text-lg font-bold text-white tracking-wide">Emon Smart Manager</h1>
      </div>

      <!-- Auth Action -->
      <div id="authContainer" class="flex items-center gap-2">
        <button id="loginBtn" onclick="loginWithGoogle()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span>গুগল লগইন</span>
        </button>

        <div id="userProfile" class="hidden items-center gap-2">
          <img id="userAvatar" src="" alt="User" class="w-7 h-7 rounded-full border border-indigo-400">
          <span id="userName" class="text-xs font-medium text-slate-300 hidden sm:inline"></span>
          <button onclick="logoutUser()" class="text-slate-400 hover:text-red-400 p-1" title="লগআউট">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Buttons -->
  <div class="max-w-4xl mx-auto w-full px-4 pt-4 flex gap-2 overflow-x-auto pb-1">
    <button onclick="switchView('calc')" id="btn-calc" class="nav-tab px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white flex items-center gap-2 whitespace-nowrap shadow">
      <i data-lucide="calculator" class="w-4 h-4"></i> ক্যালকুলেটর
    </button>
    <button onclick="switchView('shop')" id="btn-shop" class="nav-tab px-4 py-2 rounded-xl text-sm font-semibold bg-[#161f42] text-slate-400 flex items-center gap-2 whitespace-nowrap">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i> দোকান খাতা
    </button>
    <button onclick="switchView('expense')" id="btn-expense" class="nav-tab px-4 py-2 rounded-xl text-sm font-semibold bg-[#161f42] text-slate-400 flex items-center gap-2 whitespace-nowrap">
      <i data-lucide="wallet" class="w-4 h-4"></i> ব্যক্তিগত খরচ
    </button>
  </div>

  <!-- Status Bar -->
  <div class="max-w-4xl mx-auto w-full px-4 py-2 flex items-center gap-2 text-[11px] text-slate-400">
    <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
    <span id="syncStatus">লোকাল মোড (লগইন ছাড়া তথ্য ফোনে সংরক্ষিত)</span>
  </div>

  <!-- Content Container -->
  <main class="max-w-4xl mx-auto w-full px-4 pb-8 flex-1">

    <!-- 1. CALC VIEW -->
    <div id="view-calc" class="flex justify-center mt-2">
      <div class="w-full max-w-sm bg-[#121936] p-4 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="bg-[#0b1021] rounded-2xl p-4 mb-4 text-right">
          <div id="calc-exp" class="text-xs text-slate-500 h-4"></div>
          <div id="calc-val" class="text-3xl font-mono font-bold text-white tracking-wider truncate">0</div>
        </div>
        <div class="grid grid-cols-4 gap-2.5">
          <button onclick="cClear()" class="p-3.5 bg-rose-500/20 text-rose-400 font-bold rounded-2xl">C</button>
          <button onclick="cOp('/')" class="p-3.5 bg-[#1b2550] text-indigo-400 font-bold rounded-2xl">÷</button>
          <button onclick="cOp('*')" class="p-3.5 bg-[#1b2550] text-indigo-400 font-bold rounded-2xl">×</button>
          <button onclick="cDel()" class="p-3.5 bg-[#1b2550] text-slate-300 font-bold rounded-2xl">⌫</button>

          <button onclick="cNum('7')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">7</button>
          <button onclick="cNum('8')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">8</button>
          <button onclick="cNum('9')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">9</button>
          <button onclick="cOp('-')" class="p-3.5 bg-[#1b2550] text-indigo-400 font-bold rounded-2xl">−</button>

          <button onclick="cNum('4')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">4</button>
          <button onclick="cNum('5')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">5</button>
          <button onclick="cNum('6')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">6</button>
          <button onclick="cOp('+')" class="p-3.5 bg-[#1b2550] text-indigo-400 font-bold rounded-2xl">+</button>

          <button onclick="cNum('1')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">1</button>
          <button onclick="cNum('2')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">2</button>
          <button onclick="cNum('3')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">3</button>
          <button onclick="cEq()" class="p-3.5 row-span-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl flex items-center justify-center">=</button>

          <button onclick="cNum('0')" class="p-3.5 col-span-2 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">0</button>
          <button onclick="cNum('.')" class="p-3.5 bg-[#172045] hover:bg-[#1f2b5c] text-white font-semibold rounded-2xl">.</button>
        </div>
      </div>
    </div>

    <!-- 2. SHOP VIEW -->
    <div id="view-shop" class="hidden space-y-4">
      <div class="bg-[#121936] p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-sm font-semibold text-indigo-400">নতুন কাস্টমার / বাকি এন্ট্রি</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input id="shName" type="text" placeholder="কাস্টমারের নাম" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input id="shItem" type="text" placeholder="পণ্যের বিবরণ" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input id="shAmount" type="number" placeholder="টাকার পরিমাণ (৳)" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <select id="shType" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
            <option value="due">বাকি (পাওনা)</option>
            <option value="paid">জমা (পরিশোধ)</option>
          </select>
        </div>
        <button onclick="addShopItem()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-xl text-sm transition">
          সংরক্ষণ করুন
        </button>
      </div>

      <div class="bg-[#121936] p-4 rounded-2xl border border-slate-800 space-y-2">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-sm font-semibold text-white">লেনদেন তালিকা</h3>
          <span id="shTotalDue" class="text-xs bg-amber-500/10 text-amber-400 px-2 py-1 rounded-lg border border-amber-500/20 font-bold">মোট বাকি: ৳০</span>
        </div>
        <div id="shList" class="space-y-2 divide-y divide-slate-800">
          <div class="text-center py-4 text-xs text-slate-500">কোনো রেকর্ড নেই</div>
        </div>
      </div>
    </div>

    <!-- 3. EXPENSE VIEW -->
    <div id="view-expense" class="hidden space-y-4">
      <div class="bg-[#121936] p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-sm font-semibold text-emerald-400">ব্যক্তিগত খরচের হিসাব</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input id="exTitle" type="text" placeholder="খরচের খাত (উদা: বাজার)" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input id="exAmount" type="number" placeholder="টাকার পরিমাণ (৳)" class="bg-[#0b1021] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        </div>
        <button onclick="addExpenseItem()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-xl text-sm transition">
          খরচ যোগ করুন
        </button>
      </div>

      <div class="bg-[#121936] p-4 rounded-2xl border border-slate-800 space-y-2">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-sm font-semibold text-white">খরচের তালিকা</h3>
          <span id="exTotal" class="text-xs bg-rose-500/10 text-rose-400 px-2 py-1 rounded-lg border border-rose-500/20 font-bold">মোট খরচ: ৳০</span>
        </div>
        <div id="exList" class="space-y-2 divide-y divide-slate-800">
          <div class="text-center py-4 text-xs text-slate-500">কোনো খরচের হিসাব নেই</div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // ---------------------------------------------
    // FIREBASE SETUP
    // ---------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyAxwRVb4o6G66m9tZddxu-oGR_es1XHCgw",
      authDomain: "emon-smart-manager.firebaseapp.com",
      projectId: "emon-smart-manager",
      storageBucket: "emon-smart-manager.firebasestorage.app",
      messagingSenderId: "263367025617",
      appId: "1:263367025617:web:5708e1f83d4192791bb6f0",
      measurementId: "G-VKZWZGM2YK"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let localData = {
      shop: [],
      expenses: []
    };

    // Load Local Data Initially
    function initData() {
      const stored = localStorage.getItem('emon_smart_manager_data');
      if (stored) {
        try { localData = JSON.parse(stored); } catch(e){}
      }
      renderData();
    }

    // Save Data (Local + Cloud)
    function syncAndSave() {
      localStorage.setItem('emon_smart_manager_data', JSON.stringify(localData));
      renderData();

      if (currentUser) {
        setSyncUi("ক্লাউডে সেভ হচ্ছে...", "bg-amber-400");
        db.collection("users").doc(currentUser.uid).set(localData)
          .then(() => setSyncUi("ক্লাউডে সংরক্ষিত (সংযুক্ত)", "bg-emerald-400"))
          .catch(() => setSyncUi("সিঙ্ক ব্যর্থ হয়েছে", "bg-rose-500"));
      }
    }

    function setSyncUi(text, dotColor) {
      document.getElementById("syncStatus").innerText = text;
      document.getElementById("syncDot").className = `w-2 h-2 rounded-full ${dotColor}`;
    }

    // Auth Actions
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("ত্রুটি: " + err.message));
    }

    function logoutUser() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const loginBtn = document.getElementById("loginBtn");
      const userProfile = document.getElementById("userProfile");

      if (user) {
        loginBtn.classList.add("hidden");
        userProfile.classList.remove("hidden");
        userProfile.classList.add("flex");
        document.getElementById("userName").innerText = user.displayName || "ইউজার";
        document.getElementById("userAvatar").src = user.photoURL || "https://api.dicebear.com/7.x/bottts/svg?seed=Emon";

        setSyncUi("ডাটা লোড হচ্ছে...", "bg-amber-400");
        db.collection("users").doc(user.uid).get().then(doc => {
          if (doc.exists) {
            localData = Object.assign({ shop: [], expenses: [] }, doc.data());
            localStorage.setItem('emon_smart_manager_data', JSON.stringify(localData));
          } else {
            syncAndSave();
          }
          renderData();
          setSyncUi("ক্লাউডে সংরক্ষিত (সংযুক্ত)", "bg-emerald-400");
        });
      } else {
        loginBtn.classList.remove("hidden");
        userProfile.classList.add("hidden");
        userProfile.classList.remove("flex");
        setSyncUi("লোকাল মোড (লগইন ছাড়া তথ্য ফোনে সংরক্ষিত)", "bg-amber-400");
      }
    });

    // ---------------------------------------------
    // NAVIGATION
    // ---------------------------------------------
    function switchView(tab) {
      ['calc', 'shop', 'expense'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        const b = document.getElementById(`btn-${t}`);
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-[#161f42]', 'text-slate-400');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      const active = document.getElementById(`btn-${tab}`);
      active.classList.add('bg-indigo-600', 'text-white');
      active.classList.remove('bg-[#161f42]', 'text-slate-400');
    }

    // ---------------------------------------------
    // CALCULATOR
    // ---------------------------------------------
    let cState = "";
    function cNum(n) {
      if (cState === "0" && n !== ".") cState = "";
      cState += n;
      document.getElementById("calc-val").innerText = cState || "0";
    }
    function cOp(op) {
      if (!cState && op !== "-") return;
      if ("+-*/".includes(cState.slice(-1))) cState = cState.slice(0, -1);
      cState += op;
      document.getElementById("calc-val").innerText = cState;
    }
    function cClear() {
      cState = "";
      document.getElementById("calc-exp").innerText = "";
      document.getElementById("calc-val").innerText = "0";
    }
    function cDel() {
      cState = cState.slice(0, -1);
      document.getElementById("calc-val").innerText = cState || "0";
    }
    function cEq() {
      try {
        if (!cState) return;
        document.getElementById("calc-exp").innerText = cState;
        cState = String(Function(`'use strict'; return (${cState})`)());
        document.getElementById("calc-val").innerText = cState;
      } catch(e) {
        document.getElementById("calc-val").innerText = "Error";
      }
    }

    // ---------------------------------------------
    // SHOP DATA
    // ---------------------------------------------
    function addShopItem() {
      const name = document.getElementById("shName").value.trim();
      const item = document.getElementById("shItem").value.trim();
      const amount = parseFloat(document.getElementById("shAmount").value);
      const type = document.getElementById("shType").value;

      if (!name || isNaN(amount) || amount <= 0) return alert("সঠিক নাম ও টাকার পরিমাণ দিন!");

      localData.shop.unshift({ id: Date.now(), name, item: item || "বিবরণ নেই", amount, type });
      document.getElementById("shName").value = "";
      document.getElementById("shItem").value = "";
      document.getElementById("shAmount").value = "";
      syncAndSave();
    }

    function removeShop(id) {
      localData.shop = localData.shop.filter(x => x.id !== id);
      syncAndSave();
    }

    // ---------------------------------------------
    // EXPENSE DATA
    // ---------------------------------------------
    function addExpenseItem() {
      const title = document.getElementById("exTitle").value.trim();
      const amount = parseFloat(document.getElementById("exAmount").value);

      if (!title || isNaN(amount) || amount <= 0) return alert("খরচের খাত ও পরিমাণ দিন!");

      localData.expenses.unshift({ id: Date.now(), title, amount });
      document.getElementById("exTitle").value = "";
      document.getElementById("exAmount").value = "";
      syncAndSave();
    }

    function removeExpense(id) {
      localData.expenses = localData.expenses.filter(x => x.id !== id);
      syncAndSave();
    }

    // ---------------------------------------------
    // RENDER UI
    // ---------------------------------------------
    function renderData() {
      // Render Shop
      let dueTotal = 0;
      const shList = document.getElementById("shList");
      if (!localData.shop.length) {
        shList.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">কোনো রেকর্ড নেই</div>`;
      } else {
        shList.innerHTML = localData.shop.map(x => {
          if (x.type === 'due') dueTotal += x.amount; else dueTotal -= x.amount;
          return `
            <div class="flex justify-between items-center py-2 text-xs">
              <div>
                <div class="font-bold text-white">${x.name} <span class="font-normal text-slate-400">(${x.item})</span></div>
                <span class="${x.type === 'due' ? 'text-amber-400' : 'text-emerald-400'} font-semibold">${x.type === 'due' ? 'বাকি' : 'জমা'}</span>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-mono font-bold text-white">৳${x.amount}</span>
                <button onclick="removeShop(${x.id})" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>`;
        }).join('');
      }
      document.getElementById("shTotalDue").innerText = `মোট বাকি: ৳${dueTotal}`;

      // Render Expenses
      let expTotal = 0;
      const exList = document.getElementById("exList");
      if (!localData.expenses.length) {
        exList.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">কোনো খরচের হিসাব নেই</div>`;
      } else {
        exList.innerHTML = localData.expenses.map(x => {
          expTotal += x.amount;
          return `
            <div class="flex justify-between items-center py-2 text-xs">
              <span class="text-white font-medium">${x.title}</span>
              <div class="flex items-center gap-3">
                <span class="font-mono font-bold text-rose-400">৳${x.amount}</span>
                <button onclick="removeExpense(${x.id})" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>`;
        }).join('');
      }
      document.getElementById("exTotal").innerText = `মোট খরচ: ৳${expTotal}`;

      lucide.createIcons();
    }

    window.onload = () => {
      initData();
      lucide.createIcons();
    };
  </script>
</body>
</html>
